# Baseline CI for Dukaan Pro (recovery phase R0).
#
# Safety contract:
# - Uses NO repository secrets and NO production credentials.
# - Never links, pushes to, or deploys any hosted Supabase project.
# - The Supabase stack is an ephemeral local Docker stack created inside the
#   runner; its demo keys exist only for the lifetime of the job.
# - Read-only repository permissions.
#
# Tool versions are pinned to the audited baseline. Actions are pinned to full
# commit SHAs (version in the trailing comment); the gitleaks image is pinned by
# digest. Mapping: docs/recovery/ci.md.
name: ci

on:
  push:
    # Recovery branches (r1/*, r2/*, ...) must be verified before any merge.
    branches: [main, 'r[0-9]*/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  SUPABASE_CLI_VERSION: "2.113.0"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_IMAGE_DIGEST: "sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46"
  # Baseline floors from the audited state. Raise them when tests are added;
  # never lower them to make CI pass.
  BASELINE_MIN_FLUTTER_PASSED: "95"
  BASELINE_MAX_FLUTTER_SKIPPED: "1"
  BASELINE_MIN_MIGRATIONS: "19"
  BASELINE_MIN_RAW_SQL_FILES: "10"
  BASELINE_MIN_PGTAP_TESTS: "40"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forbidden tracked paths
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.temp|\.branches)/|(^|/)local\.properties$|(^|/)\.env($|\.)|\.(sqlite|sqlite3|db|apk|aab|jks|keystore)$|(^|/)docker\.env$|(^|/)build/|(^|/)\.dart_tool/'; then
            echo "::error::Build outputs, local runtime state, databases or secrets are tracked."
            exit 1
          fi
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}@${GITLEAKS_IMAGE_DIGEST}" \
            git --redact --no-banner --verbose /repo
          echo "::notice title=gitleaks::gitleaks v${GITLEAKS_VERSION} scanned full history: no leaks found"

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify toolchain matches audited baseline
        run: |
          set -euo pipefail
          flutter --version
          flutter --version | grep -q "Flutter ${FLUTTER_VERSION} "
          flutter --version | grep -q "Dart 3.12.1"
          echo "::notice title=Toolchain::$(flutter --version | head -1 | cut -c1-60) / $(dart --version 2>&1 | cut -c1-40)"
      - name: Restore dependencies (lock file must not change)
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code pubspec.lock
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: |
          set -euo pipefail
          flutter test --reporter expanded --file-reporter json:"${RUNNER_TEMP}/flutter-tests.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/flutter-tests.json" \
            --label "flutter test" --min-passed "${BASELINE_MIN_FLUTTER_PASSED}" --max-skipped "${BASELINE_MAX_FLUTTER_SKIPPED}"
      - name: Opt-in stress test
        run: |
          set -euo pipefail
          flutter test test/stress_performance_test.dart --dart-define=RUN_STRESS=true --reporter expanded \
            --file-reporter json:"${RUNNER_TEMP}/stress-tests.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/stress-tests.json" \
            --label "stress test" --min-passed 1 --max-skipped 0

  database:
    name: Fresh Supabase schema, raw SQL and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start ephemeral local stack (applies all migrations + seed from zero)
        run: |
          set -euo pipefail
          installed=$(supabase --version)
          test "${installed}" = "${SUPABASE_CLI_VERSION}"
          echo "::notice title=Supabase CLI::supabase CLI ${installed}"
          # Step logs of this public repository need sign-in; surface the tail
          # of a failed start as an annotation so the cause is reviewable.
          if ! supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector \
              > "${RUNNER_TEMP}/supabase-start.txt" 2>&1; then
            cat "${RUNNER_TEMP}/supabase-start.txt"
            tail -n 25 "${RUNNER_TEMP}/supabase-start.txt" | sed -E 's/(eyJ|sb_secret_|sb_publishable_)[A-Za-z0-9._-]*/[redacted]/g' \
              | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=supabase start failed::/'
            echo
            exit 1
          fi
          cat "${RUNNER_TEMP}/supabase-start.txt" | grep -vE 'key|secret|JWT' || true
      - name: Every migration file applied
        run: |
          set -euo pipefail
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(docker exec supabase_db_POS_store psql -X -U postgres -d postgres -At \
            -c "select count(*) from supabase_migrations.schema_migrations")
          echo "migration files=${expected} applied=${applied}"
          test "${expected}" = "${applied}"
          test "${applied}" -ge "${BASELINE_MIN_MIGRATIONS}"
          echo "::notice title=Migrations::${applied}/${expected} migrations applied from zero on a fresh stack"
      - name: Raw SQL security suites (ordered list from scripts/run_raw_sql_tests.ps1)
        run: |
          set -euo pipefail
          mapfile -t tests < <(sed -n '/rawTests = @(/,/^)/p' scripts/run_raw_sql_tests.ps1 | grep -oE '[a-z0-9_]+\.sql')
          test "${#tests[@]}" -gt 0
          for t in "${tests[@]}"; do
            echo "RAW SQL: ${t}"
            docker exec -i supabase_db_POS_store psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < "supabase/tests_raw/${t}"
          done
          echo "Raw SQL verification passed: ${#tests[@]} files."
          test "${#tests[@]}" -ge "${BASELINE_MIN_RAW_SQL_FILES}"
          echo "::notice title=Raw SQL::${#tests[@]}/${#tests[@]} raw SQL files passed"
      - name: pgTAP suites
        run: |
          set -euo pipefail
          supabase test db 2>&1 | tee "${RUNNER_TEMP}/pgtap.txt"
          grep -q "^Result: PASS" "${RUNNER_TEMP}/pgtap.txt"
          tests=$(grep -oE 'Tests=[0-9]+' "${RUNNER_TEMP}/pgtap.txt" | tail -1 | cut -d= -f2)
          files=$(grep -oE 'Files=[0-9]+' "${RUNNER_TEMP}/pgtap.txt" | tail -1 | cut -d= -f2)
          test -n "${tests}"
          test "${tests}" -ge "${BASELINE_MIN_PGTAP_TESTS}"
          echo "::notice title=pgTAP::${tests} pgTAP tests passed in ${files} files"
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup

  r1-integration:
    name: R1 integration (disposable local stack, HTTP + direct DB, TZ matrix, expected-red gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Restore dependencies (lock file must not change)
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code pubspec.lock
      - name: Local-target guard (fails closed before any stack exists)
        run: |
          set -uo pipefail
          flutter test test_r1/guard --reporter expanded --file-reporter json:"${RUNNER_TEMP}/guard.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/guard.json"             --label "R1 local-target guard" --min-passed 15 --max-skipped 0
      - name: Time-zone matrix proves TZ actually changed
        run: |
          set -euo pipefail
          TZ=UTC flutter test test_r1/tz --dart-define=EXPECTED_TZ_OFFSET_MINUTES=0 --reporter expanded
          TZ=Asia/Karachi flutter test test_r1/tz --dart-define=EXPECTED_TZ_OFFSET_MINUTES=300 --reporter expanded
          TZ=EST5 flutter test test_r1/tz --dart-define=EXPECTED_TZ_OFFSET_MINUTES=-300 --reporter expanded
          echo "::notice title=TZ matrix::UTC (+0), Asia/Karachi (+300 min) and EST5 (-300 min) verified"
      - name: R1.1 checkout durability suite (green, local Drift only)
        run: |
          set -uo pipefail
          flutter test test_r1/green --reporter expanded --file-reporter json:"${RUNNER_TEMP}/green.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/green.json" \
            --label "R1.1 checkout durability (green)" --min-passed 76 --max-skipped 0
      - name: Start fresh local Supabase stack (all migrations + seed from zero)
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "${SUPABASE_CLI_VERSION}"
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector \
            > "${RUNNER_TEMP}/supabase-start.txt" 2>&1 || {
              tail -n 25 "${RUNNER_TEMP}/supabase-start.txt" | sed -E 's/(eyJ|sb_secret_|sb_publishable_)[A-Za-z0-9._-]*/[redacted]/g'
              exit 1; }
          applied=$(docker exec supabase_db_POS_store psql -X -U postgres -d postgres -At \
            -c "select count(*) from supabase_migrations.schema_migrations")
          test "${applied}" = "$(ls supabase/migrations/*.sql | wc -l)"
          test "${applied}" -ge "${BASELINE_MIN_MIGRATIONS}"
          echo "::notice title=R1 stack::${applied} migrations applied from zero"
      - name: Export local-only HTTP endpoint (loopback URL + local anon key)
        run: |
          set -euo pipefail
          supabase status -o env > "${RUNNER_TEMP}/status.env"
          url=$(grep '^API_URL=' "${RUNNER_TEMP}/status.env" | cut -d= -f2- | tr -d '"')
          key=$(grep '^ANON_KEY=' "${RUNNER_TEMP}/status.env" | cut -d= -f2- | tr -d '"')
          rm -f "${RUNNER_TEMP}/status.env"
          echo "::add-mask::${key}"
          case "${url}" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "::error::non-local API_URL"; exit 1 ;; esac
          echo "R1_HTTP_URL=${url}" >> "${GITHUB_ENV}"
          echo "R1_HTTP_ANON_KEY=${key}" >> "${GITHUB_ENV}"
      - name: Direct-DB layer (green)
        run: |
          set -uo pipefail
          flutter test test_r1/direct_db --dart-define=R1_SERVER=true --reporter expanded \
            --file-reporter json:"${RUNNER_TEMP}/direct.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/direct.json" \
            --label "R1 direct-DB (green)" --min-passed 15 --max-skipped 0
      - name: HTTP layer through Kong/PostgREST/GoTrue (green)
        run: |
          # No `set -e`: step logs need sign-in on this public repository, so
          # the count script always runs and publishes every failing test as an
          # annotation; its exit status decides the step.
          set -uo pipefail
          flutter test test_r1/http --reporter expanded \
            --dart-define=R1_HTTP_URL="${R1_HTTP_URL}" --dart-define=R1_HTTP_ANON_KEY="${R1_HTTP_ANON_KEY}" \
            --file-reporter json:"${RUNNER_TEMP}/http.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/http.json" \
            --label "R1 HTTP (green)" --min-passed 18 --max-skipped 0
      - name: R1.2 timestamp suite under UTC, Asia/Karachi and EST5 (local + direct DB + HTTP)
        run: |
          set -uo pipefail
          status=0
          for zone in UTC Asia/Karachi EST5; do
            report="${RUNNER_TEMP}/time-$(echo "${zone}" | tr '/' '-').json"
            TZ="${zone}" flutter test test_r1/green/t1_timestamp_local_test.dart \
              test_r1/direct_db/t1_timestamp_test.dart test_r1/http/timestamp_http_test.dart \
              --dart-define=R1_SERVER=true --reporter expanded \
              --dart-define=R1_HTTP_URL="${R1_HTTP_URL}" --dart-define=R1_HTTP_ANON_KEY="${R1_HTTP_ANON_KEY}" \
              --file-reporter json:"${report}"
            python3 .github/scripts/flutter_test_counts.py "${report}" \
              --label "R1.2 timestamps TZ=${zone}" --min-passed 20 --max-skipped 0 || status=1
            # R1.3: local void, and the server void window / restart / F-2 in each zone.
            void_report="${RUNNER_TEMP}/void-$(echo "${zone}" | tr '/' '-').json"
            TZ="${zone}" flutter test test_r1/green/void_local_test.dart test_r1/direct_db/void_convergence_test.dart \
              --name '^(B|C|D|K|L|F-2|a second|a failure)' --dart-define=R1_SERVER=true --reporter expanded \
              --file-reporter json:"${void_report}"
            python3 .github/scripts/flutter_test_counts.py "${void_report}" \
              --label "R1.3 void TZ=${zone}" --min-passed 9 --max-skipped 0 || status=1
          done
          exit "${status}"
      - name: Expected-red recovery suite under TZ=Asia/Karachi (gate)
        run: |
          set -euo pipefail
          TZ=Asia/Karachi flutter test test_r1/red --concurrency=2 --dart-define=R1_SERVER=true \
            --dart-define=R1_HTTP_URL="${R1_HTTP_URL}" --dart-define=R1_HTTP_ANON_KEY="${R1_HTTP_ANON_KEY}" \
            --file-reporter json:"${RUNNER_TEMP}/red.json" > "${RUNNER_TEMP}/red.txt" 2>&1 || true
          python3 .github/scripts/expect_red.py "${RUNNER_TEMP}/red.json" --manifest test_r1/red/EXPECTED_RED.txt
      - name: No scratch database left behind
        if: always()
        run: |
          left=$(docker exec supabase_db_POS_store psql -X -U postgres -d postgres -At \
            -c "select count(*) from pg_database where datname like 'r1_%'" 2>/dev/null || echo 0)
          test "${left}" = "0"
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
