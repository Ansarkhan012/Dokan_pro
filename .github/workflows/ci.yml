# Baseline CI for Dukaan Pro (recovery phase R0).
#
# Safety contract:
# - Uses NO repository secrets and NO production credentials.
# - Never links, pushes to, or deploys any hosted Supabase project.
# - The Supabase stack is an ephemeral local Docker stack created inside the
#   runner; its demo keys exist only for the lifetime of the job.
# - Read-only repository permissions.
#
# Tool versions are pinned to the audited baseline. Actions are pinned to full
# commit SHAs (version in the trailing comment); the gitleaks image is pinned by
# digest. Mapping: docs/recovery/ci.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  SUPABASE_CLI_VERSION: "2.113.0"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_IMAGE_DIGEST: "sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46"
  # Baseline floors from the audited state. Raise them when tests are added;
  # never lower them to make CI pass.
  BASELINE_MIN_FLUTTER_PASSED: "95"
  BASELINE_MAX_FLUTTER_SKIPPED: "1"
  BASELINE_MIN_MIGRATIONS: "18"
  BASELINE_MIN_RAW_SQL_FILES: "10"
  BASELINE_MIN_PGTAP_TESTS: "40"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forbidden tracked paths
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.temp|\.branches)/|(^|/)local\.properties$|(^|/)\.env($|\.)|\.(sqlite|sqlite3|db|apk|aab|jks|keystore)$|(^|/)docker\.env$|(^|/)build/|(^|/)\.dart_tool/'; then
            echo "::error::Build outputs, local runtime state, databases or secrets are tracked."
            exit 1
          fi
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}@${GITLEAKS_IMAGE_DIGEST}" \
            git --redact --no-banner --verbose /repo
          echo "::notice title=gitleaks::gitleaks v${GITLEAKS_VERSION} scanned full history: no leaks found"

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify toolchain matches audited baseline
        run: |
          set -euo pipefail
          flutter --version
          flutter --version | grep -q "Flutter ${FLUTTER_VERSION} "
          flutter --version | grep -q "Dart 3.12.1"
          echo "::notice title=Toolchain::$(flutter --version | head -1 | cut -c1-60) / $(dart --version 2>&1 | cut -c1-40)"
      - name: Restore dependencies (lock file must not change)
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code pubspec.lock
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: |
          set -euo pipefail
          flutter test --reporter expanded --file-reporter json:"${RUNNER_TEMP}/flutter-tests.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/flutter-tests.json" \
            --label "flutter test" --min-passed "${BASELINE_MIN_FLUTTER_PASSED}" --max-skipped "${BASELINE_MAX_FLUTTER_SKIPPED}"
      - name: Opt-in stress test
        run: |
          set -euo pipefail
          flutter test test/stress_performance_test.dart --dart-define=RUN_STRESS=true --reporter expanded \
            --file-reporter json:"${RUNNER_TEMP}/stress-tests.json"
          python3 .github/scripts/flutter_test_counts.py "${RUNNER_TEMP}/stress-tests.json" \
            --label "stress test" --min-passed 1 --max-skipped 0

  database:
    name: Fresh Supabase schema, raw SQL and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start ephemeral local stack (applies all migrations + seed from zero)
        run: |
          set -euo pipefail
          installed=$(supabase --version)
          test "${installed}" = "${SUPABASE_CLI_VERSION}"
          echo "::notice title=Supabase CLI::supabase CLI ${installed}"
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector
      - name: Every migration file applied
        run: |
          set -euo pipefail
          expected=$(ls supabase/migrations/*.sql | wc -l)
          applied=$(docker exec supabase_db_POS_store psql -X -U postgres -d postgres -At \
            -c "select count(*) from supabase_migrations.schema_migrations")
          echo "migration files=${expected} applied=${applied}"
          test "${expected}" = "${applied}"
          test "${applied}" -ge "${BASELINE_MIN_MIGRATIONS}"
          echo "::notice title=Migrations::${applied}/${expected} migrations applied from zero on a fresh stack"
      - name: Raw SQL security suites (ordered list from scripts/run_raw_sql_tests.ps1)
        run: |
          set -euo pipefail
          mapfile -t tests < <(sed -n '/rawTests = @(/,/^)/p' scripts/run_raw_sql_tests.ps1 | grep -oE '[a-z0-9_]+\.sql')
          test "${#tests[@]}" -gt 0
          for t in "${tests[@]}"; do
            echo "RAW SQL: ${t}"
            docker exec -i supabase_db_POS_store psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < "supabase/tests_raw/${t}"
          done
          echo "Raw SQL verification passed: ${#tests[@]} files."
          test "${#tests[@]}" -ge "${BASELINE_MIN_RAW_SQL_FILES}"
          echo "::notice title=Raw SQL::${#tests[@]}/${#tests[@]} raw SQL files passed"
      - name: pgTAP suites
        run: |
          set -euo pipefail
          supabase test db 2>&1 | tee "${RUNNER_TEMP}/pgtap.txt"
          grep -q "^Result: PASS" "${RUNNER_TEMP}/pgtap.txt"
          tests=$(grep -oE 'Tests=[0-9]+' "${RUNNER_TEMP}/pgtap.txt" | tail -1 | cut -d= -f2)
          files=$(grep -oE 'Files=[0-9]+' "${RUNNER_TEMP}/pgtap.txt" | tail -1 | cut -d= -f2)
          test -n "${tests}"
          test "${tests}" -ge "${BASELINE_MIN_PGTAP_TESTS}"
          echo "::notice title=pgTAP::${tests} pgTAP tests passed in ${files} files"
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
